<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
    </style>
    <script>
      (function () {
        var isHomeEntry = window.location.pathname === "/";

        if (!isHomeEntry) {
          return;
        }

        document.documentElement.style.background = "#0b0a09";
        document.body.style.background = "#0b0a09";

        window.addEventListener(
          "DOMContentLoaded",
          function () {
            var root = document.getElementById("root");
            if (!root) {
              return;
            }

            root.style.minHeight = "100svh";
            root.style.background = "#0b0a09";
          },
          { once: true }
        );
      })();
    </script>
    <title>Anton Shell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
  </html>
